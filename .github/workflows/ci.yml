name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (error-level, zero-tolerance)
        run: npm run lint

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Typecheck (React layer)
        run: npm run typecheck:react

      - name: Test
        run: npm test
